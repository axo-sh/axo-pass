name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      # Generates Swift bindings and the FFI static library.
      - name: Build FFI
        run: PROFILE=release ./scripts/build-ffi.sh

      # Stages target/dist/ap and target/dist/AxoPassBrowserHost.
      - name: Build CLI
        run: PROFILE=release ./scripts/build-cli.sh

      - name: Strudel release
        id: strudel
        uses: octavore/strudel-release-action@v1
        with:
          strudel-version: 'v0.8.0'
          apple-api-key-contents: ${{ secrets.APPLE_API_KEY_CONTENTS }}
          apple-certificate: ${{ secrets.APPLE_CERTIFICATE }}
          apple-certificate-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          apple-team-id: ${{ vars.APPLE_TEAM_ID }}
          apple-api-issuer: ${{ vars.APPLE_API_ISSUER }}
          apple-api-key: ${{ vars.APPLE_API_KEY }}

      - name: Create draft release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: ${{ steps.strudel.outputs.dmg-path }}
