name: 'iOS'

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  check-ios:
    runs-on: macos-latest
    strategy:
      matrix:
        target:
          - aarch64-apple-ios
          - aarch64-apple-ios-sim
    steps:
      - uses: actions/checkout@v7

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # The ffi and cli crates are not built for iOS.
      - name: check
        run: cargo check -p axo-pass-core --no-default-features --target ${{ matrix.target }}
