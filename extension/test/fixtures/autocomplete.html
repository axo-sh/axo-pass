<!doctype html>
<html>
  <body>
    <form id="search">
      <input id="q" type="search" name="q" />
    </form>
    <form id="login">
      <input id="promo" type="text" name="promo" />
      <input id="email" type="email" name="login_field" autocomplete="username" />
      <input id="note" type="text" name="note" />
      <input id="password" type="password" name="pw" autocomplete="current-password" />
      <input id="otp" type="text" autocomplete="one-time-code" />
    </form>
  </body>
</html>
