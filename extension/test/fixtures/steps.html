<!doctype html>
<html>
  <body>
    <!-- Sign-up form. A fill never writes the saved password to a new-password field. -->
    <form id="signup" data-rect="10,400,300,100">
      <input id="signup-email" type="email" autocomplete="email" />
      <input id="signup-password" type="password" autocomplete="new-password" />
    </form>

    <!-- First step of a sign-in that asks for the username alone. -->
    <div id="step">
      <input id="identifier" type="email" name="identifier" />
    </div>
  </body>
</html>
