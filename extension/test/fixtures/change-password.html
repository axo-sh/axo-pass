<!doctype html>
<html>
  <body>
    <!-- Change-password form marked with autocomplete. The hidden username
         names the account. -->
    <form id="change">
      <input id="account" type="hidden" autocomplete="username" value="tp@example.com" />
      <input id="current" type="password" name="old" autocomplete="current-password" />
      <input id="new" type="password" name="new" autocomplete="new-password" />
      <input id="new-confirm" type="password" name="confirm" autocomplete="new-password" />
      <button type="submit">Change password</button>
    </form>

    <!-- Change-password form without autocomplete. -->
    <form id="change-plain">
      <input id="plain-1" type="password" name="pw1" />
      <input id="plain-2" type="password" name="pw2" />
      <input id="plain-3" type="password" name="pw3" />
      <button type="submit">Save</button>
    </form>

    <!-- Change-password form found by labels, with no confirm field. -->
    <form id="change-labels">
      <label for="label-old">Old password</label>
      <input id="label-old" type="password" />
      <label for="label-new">New password</label>
      <input id="label-new" type="password" />
    </form>
  </body>
</html>
