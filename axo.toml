project_name = "axo-pass"
env_file = ".env.local"

[profiles]
release = "axo.release.toml"

[tasks]
build = ":strudel:build"
run = ":strudel:run"
logs = "tail -F ~/Library/Logs/Axo\\ Pass/app.log"

fmt = [
  "cargo clippy --workspace --all-targets --fix --allow-dirty --allow-staged",
  "cargo +nightly fmt --all",
]
check = "cargo check --workspace --all-targets"
test = "cargo test --workspace"

"test:gpg" = "gpgconf --kill gpg-agent; echo 1234 | gpg -as -"
"test:ssh" = "ssh-add ~/.ssh/id_ed25519"

# create the new app
"app:ffi" = "./scripts/build-ffi.sh"
"app:ffi:release" = "PROFILE=release ./scripts/build-ffi.sh"
"app:cli" = "./scripts/build-cli.sh"
"app:cli:release" = "PROFILE=release ./scripts/build-cli.sh"

# strudel builds, signs (using entitlements + provisioning profile from
# strudel.toml), and runs the app bundle. app:ffi is the pre-build codegen
# step: uniffi-bindgen must run before Swift compiles. app:cli stages the
# `ap` binary at target/dist/ap so strudel can embed it as a resource.
"strudel:build" = [":app:ffi", ":app:cli", "strudel build"]
"strudel:run" = [":app:ffi", ":app:cli", "strudel run"]
"strudel:release" = [":app:ffi:release", ":app:cli:release", "strudel release"]

[env]
FRITTATA_DEBUG = "1"
