project_name = "axo-pass"
env_file = ".env.local"

[profiles]
release = "axo.release.toml"

[tasks]
build = [":app:ffi", ":app:cli", "strudel build"]
run = [":app:ffi", ":app:cli", "strudel run"]
reload = [
  "ap ssh-agent stop || true",
  "pkill -f \"app/.build/dist/Axo Pass.app\" || true",
  ":run",
  "ap ssh-agent start",
]
# Rebuild and relaunch the Swift app only. Run `reload` after Rust changes.
"reload:app" = [
  "pkill -f \"app/.build/dist/Axo Pass.app\" || true",
  "strudel run",
]
release = [":app:ffi:release", ":app:cli:release", "strudel release"]

logs = "tail -F ~/Library/Logs/Axo\\ Pass/app.log"

fmt = [
  "cargo clippy --workspace --all-targets --fix --allow-dirty --allow-staged",
  "cargo +nightly fmt --all",
]

"fmt:all" = { command = [":fmt", ":app:fmt"], parallel = true }
check = "cargo check --workspace --all-targets"
test = "cargo test --workspace"
"test:ecies" = "cargo test -p axo-pass-core --lib crypto::ecies"
# Rewrites crates/core/src/crypto/ecies/vectors.json from Security.framework. macOS only.
"ecies:vectors" = "cargo test -p axo-pass-core --lib crypto::ecies::apple_tests::write_vectors -- --ignored"

"test:gpg" = "gpgconf --kill gpg-agent; echo 1234 | gpg -as -"
"test:ssh" = "ssh-add ~/.ssh/id_ed25519"
"test:ssh:sign" = "echo 123 | ssh-keygen -Y sign -f ~/.ssh/id_ed25519 -n test"

# app:ffi is the pre-build codegen step: uniffi-bindgen must run before Swift compiles.
"app:ffi" = "./scripts/build-ffi.sh"
"app:ffi:release" = "PROFILE=release ./scripts/build-ffi.sh"

# app:cli stages the `ap` binary at target/dist/ap so strudel can embed it as a resource.
"app:cli" = "./scripts/build-cli.sh"
"app:cli:release" = "PROFILE=release ./scripts/build-cli.sh"

"app:fmt" = "swift format -i --recursive ."

[env]
FRITTATA_DEBUG = "1"

[global_packages]
"nodejs/node" = "^26.2.0"
