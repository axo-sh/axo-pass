project_name = "axo-pass"
env_file = ".env.local"

[profiles]
release = "axo.release.toml"

[tasks]
dev = "tauri dev"
build = """\
  APP_BUILD_SHA=$(git rev-parse head) \
  APP_BUILT_AT=$(date) \
  cargo-tauri build -b app \
"""
icon = "tauri icon ./src-tauri/misc/app-icon.png"
types = [
  "typeshare ./src-tauri --lang=typescript --output-file=src/binding.ts",
  "biome check --write src/binding.ts",
]
start = "./src-tauri/target/release/bundle/macos/Axo\\ Pass.app/Contents/MacOS/axo-pass"
restart = [":build", ":start"]
biome = "biome check --formatter-enabled=true --linter-enabled=true"
biome-fix = "biome check --write"
logs = "tail -F ~/Library/Logs/com.breakfastlabs.frittata/frittata.log"
fmt = "cd src-tauri && cargo clippy --fix --allow-dirty && cargo +nightly fmt"
"test:gpg" = "gpgconf --kill gpg-agent; echo 1234 | gpg -as -"
"test:ssh" = "ssh-add ~/.ssh/id_ed25519"
"app:ffi" = "./scripts/build-ffi.sh"
"app:build" = [":app:ffi", "swift build --package-path app"]
"app:run" = [":app:ffi", "swift run --package-path app"]
"app:sign" = "./scripts/sign-app.sh"
"app:ffi:release" = "PROFILE=release ./scripts/build-ffi.sh"
"app:sign:release" = "PROFILE=release ./scripts/sign-app.sh"
# Release run: build, codesign with entitlements (so keychain access groups,
# LocalAuthentication, etc. work), then exec the signed binary directly. We
# don't use `swift run` here since it would relink/re-sign and clobber our
# signature.
"app:build:release" = [":app:ffi:release", "swift build -c release --package-path app", ":app:sign:release"]
"app:run:release" = [":app:build:release", "\"$(swift build -c release --package-path app --show-bin-path)/axo_pass\""]

[packages]
"nodejs/node" = "^25.0.0"

[env]
FRITTATA_DEBUG = "1"
