[workspace]
resolver = "2"
members = [
  "crates/cli",
  "crates/core",
  "crates/ffi",
]

[workspace.package]
version = "0.5.0-beta.1"
edition = "2024"

[workspace.dependencies]
anyhow = "1.0.104"
axo-pass-core = {path = "crates/core"}
log = "0.4.34"
secrecy = "0.10.3"
serde = {version = "1", features = ["derive"]}
serde_json = { version = "1", features = ["raw_value"] }
thiserror = "2.0.21"
tokio = {version = "1.53.3", features = ["full"]}

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
strip = true
