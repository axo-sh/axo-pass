[package]
name = "axo-pass"
version.workspace = true
edition.workspace = true
description = "macos touch id secrets manager"
default-run = "axo-pass"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["rlib"]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "frittata_lib"

[dependencies]
anyhow.workspace = true
async-trait = "0.1"
axo-pass-cli.workspace = true
axo-pass-core.workspace = true
clap = {version = "4.6.1", features = ["derive"]}
log.workspace = true
percent-encoding = "2.3.2"
regex = "1.12.3"
secrecy = {version = "0.10.3", features = ["serde"]}
serde.workspace = true
serde_json.workspace = true
ssh-agent-lib = "0.5.2"
ssh-key = {version = "0.6.7", features = ["rsa"]}
tauri = {version = "2", features = []}
tauri-plugin-cli = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-utils = "2.8.3"
thiserror.workspace = true
time = {version = "0.3.47", features = ["serde", "serde-well-known"]}
tokio.workspace = true
typeshare = "1.0.5"
uuid = {version = "1.23.1", features = ["serde", "v4", "v7"]}

[dev-dependencies]
tempfile = "3"

[build-dependencies]
tauri-build = {version = "2", features = []}

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
