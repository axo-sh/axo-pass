# strudel.toml — strudel build configuration
#
# Commands:
#   strudel build    — assemble + sign the .app bundle
#   strudel run      — build, then launch locally
#   strudel release  — signed, notarized, packaged DMG
#
# Signing identity is picked up via (highest precedence first): the
# APPLE_SIGNING_IDENTITY / APPLE_TEAM_ID env vars (see .env.local), a
# [apple] section here, or ~/.config/strudel/config.toml. No identity
# configured anywhere falls back to ad-hoc signing.
#
# `strudel release` additionally needs notarization credentials
# (APPLE_API_ISSUER / APPLE_API_KEY / APPLE_API_KEY_PATH, or the
# equivalent [apple] fields) — see `strudel help notarize`.

[app]
name         = "Axo Pass"
bundle_id    = "com.breakfastlabs.frittata"
version      = "0.2.0"
build_number = "1"

[build]
source_dir             = "app"
entitlements_json_path = "app/misc/entitlements.json"
info_json_path         = "app/misc/info.json"
target_name            = "axo_pass"
provisioning_profile   = "app/misc/Frittata_Developer_ID_Application.provisionprofile"

[build.icon]
src        = "app/misc/axo-pass.svg"
scale      = 1.45
background = "#1a1a1a"

# `ap` CLI binary, staged by `axo app:cli` (see scripts/build-cli.sh) into
# target/dist/ap; copied into Contents/MacOS/ap and signed so it passes
# `codesign --verify --deep --strict` / notarization as a nested executable.
#
# It is signed without entitlements, so the agent cannot see managed SSH keys:
# those live in the data protection keychain, reachable only with
# keychain-access-groups. `ap` works around this by proxying managed key
# operations to the app.
[[build.copy]]
src      = "target/dist/ap"
dest_dir = "Contents/MacOS"
sign     = true

# `pinentry-program` takes a bare path with no arguments, so gpg-agent can't
# invoke `ap pinentry` directly. This wrapper is what gets pointed to instead;
# see crates/cli/src/cli/commands/pinentry.rs.
[[build.copy]]
src      = "app/misc/ap-pinentry"
dest_dir = "Contents/Resources"

# SSH_ASKPASS takes a bare path with no arguments, so ssh/ssh-add can't invoke
# `ap ssh-askpass` directly. This wrapper is what gets pointed to instead; see
# crates/cli/src/cli/commands/ssh_askpass.rs.
[[build.copy]]
src      = "app/misc/ap-ssh-askpass"
dest_dir = "Contents/Resources"
