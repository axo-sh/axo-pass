[package]
name = "axo-pass-cli"
version.workspace = true
edition.workspace = true
description = "axo-pass CLI binary"

[lib]
crate-type = ["rlib"]
name = "axo_pass_cli"

[[bin]]
name = "ap"
path = "src/main.rs"

[dependencies]
age = {version = "0.11.3", features = ["armor"]}
anyhow.workspace = true
axo-pass-core.workspace = true
base64 = "0.23.1"
clap = {version = "4.6.6", features = ["derive"]}
clap_complete = "4.6.9"
clml = {version = "0.2.0", features = ["anstream"]}
dirs = "7.0.0"
dotenvy = "0.15.7"
fork = "0.10.0"
glob = "0.3"
inquire = "0.9.4"
itertools = "0.15.0"
log.workspace = true
regex = "1.13.1"
rsa = "0.9.10"
secrecy = {version = "0.10.3", features = ["serde"]}
serde.workspace = true
serde_json.workspace = true
ssh-agent-lib = "0.6.0"
ssh-encoding = "0.2"
ssh-key = {version = "0.6.7", features = ["rsa"]}
thiserror.workspace = true
time = {version = "0.3.55", features = ["serde", "serde-well-known"]}
tokio.workspace = true
tracing-appender = "0.2"
tracing-subscriber = {version = "0.3", features = ["env-filter"]}
uuid = {version = "1.26.0", features = ["v4"]}
