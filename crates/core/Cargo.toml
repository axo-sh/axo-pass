[package]
name = "axo-pass-core"
version.workspace = true
edition.workspace = true
description = "axo-pass core"

[lib]
crate-type = ["rlib"]
name = "axo_pass_core"

[dependencies]
aes-gcm = "0.10.3"
age = {version = "0.11.5", features = ["armor"]}
age-core = "0.11.0"
anyhow.workspace = true
async-trait = "0.1"
base64 = "0.23.1"
block2 = "0.6.2"
clml = {version = "0.2.0", features = ["anstream"]}
coset = "0.4"
dirs = "7.0.0"
glob = "0.3"
indoc = "2.0.8"
itertools = "0.15.0"
jiff = "0.2.38"
libc = "0.2"
libproc = "0.14.11"
log.workspace = true
lru = "0.18.5"
md5 = "0.8"
objc2 = "0.6.5"
objc2-app-kit = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-foundation = "0.3.2"
objc2-local-authentication = "0.3.2"
objc2-security = "0.3.2"
p256 = "0.13"
passkey-authenticator = "0.5.0"
passkey-types = "0.5.0"
percent-encoding = "2.3.2"
psl = "2.1.241"
regex = "1.13.1"
rsa = "0.9.10"
secrecy = {version = "0.10.3", features = ["serde"]}
serde.workspace = true
serde_json.workspace = true
serde_with = {version = "3.24.0", features = ["base64"]}
shlex = "2.0.1"
socket2 = { version = "0.6", features = ["all"] }
ssh-agent-lib = "0.6.0"
ssh-encoding = "0.2"
ssh-key = {version = "0.6.7", features = ["rsa", "encryption"]}
thiserror.workspace = true
time = {version = "0.3.55", features = ["local-offset", "serde", "serde-well-known"]}
tokio.workspace = true
toml = "1.1.8"
totp-rs = {version = "5.7", features = ["otpauth"]}
tracing-appender = "0.2"
tracing-subscriber = {version = "0.3", features = ["env-filter"]}
url = "2.5.8"
uuid = {version = "1.28.0", features = ["serde", "v4", "v7"]}
zeroize = {version = "1.9.1", features = ["derive"]}

[dev-dependencies]
proptest = "1.12.0"
tempfile = "3"
